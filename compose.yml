services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: workflow-engine-db
    environment:
      POSTGRES_USER: workflow_engine
      POSTGRES_PASSWORD: workflow_dev
      POSTGRES_DB: workflow_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-db:
    image: docker.io/library/postgres:16-alpine
    container_name: workflow-engine-test-db
    environment:
      POSTGRES_USER: workflow_engine_test
      POSTGRES_PASSWORD: test_secret
      POSTGRES_DB: workflow_engine_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_engine_test"]
      interval: 2s
      timeout: 2s
      retries: 5

  app:
    build: .
    container_name: workflow-engine-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/workflow_engine
      DB_USER: workflow_engine
      DB_PASSWORD: workflow_dev
      APP_PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

  dev:
    image: docker.io/library/clojure:temurin-21-tools-deps
    container_name: workflow-engine-dev
    working_dir: /app
    ports:
      - "7888:7888"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/workflow_engine
      DB_USER: workflow_engine
      DB_PASSWORD: workflow_dev
    volumes:
      - .:/app:Z
      - maven-cache:/root/.m2
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  test-runner:
    image: docker.io/library/clojure:temurin-21-tools-deps
    container_name: workflow-engine-test-runner
    working_dir: /app
    environment:
      DATABASE_URL: jdbc:postgresql://test-db:5432/workflow_engine_test
      DB_USER: workflow_engine_test
      DB_PASSWORD: test_secret
    volumes:
      - .:/app:Z
      - maven-cache:/root/.m2
    depends_on:
      test-db:
        condition: service_healthy
    command: ["clojure", "-M:test"]

volumes:
  pgdata:
  maven-cache:
